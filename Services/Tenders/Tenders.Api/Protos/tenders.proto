syntax = "proto3";

option csharp_namespace = "Tenders.Grpc";
package tenders;

// Internal gRPC API for the Tenders microservice.
// Used by Platform.Aggregator for high-performance parallel calls over HTTP/2.
// Field numbers are immutable — changing them breaks binary compatibility with existing clients.
service TendersService {
  // Retrieve a single tender by its unique identifier.
  rpc GetTender (GetTenderRequest) returns (TenderReply);

  // Retrieve all tenders for a specific procuring entity, with optional status filter.
  rpc GetTendersByEntity (GetTendersByEntityRequest) returns (TendersReply);
}

// Request to fetch a single tender by ID.
message GetTenderRequest {
  int64 id = 1; // Tender primary key
}

// Request to fetch tenders for a procuring entity with optional status filter.
message GetTendersByEntityRequest {
  int64 procuring_entity_id = 1; // Procuring entity primary key
  string status = 2;             // Optional: filter by status (empty = all)
}

// Single tender data transfer object for gRPC responses.
message TenderReply {
  int64  id                   = 1;
  int64  procuring_entity_id  = 2;
  string title                = 3;
  double expected_budget      = 4; // decimal serialized as double (sufficient for display)
  string status               = 5;
  string published_at         = 6; // ISO 8601 string; empty if not published
  string bidding_deadline     = 7; // ISO 8601 string; empty if not set
  string created_at           = 8; // ISO 8601 string
}

// Collection of tenders.
message TendersReply {
  repeated TenderReply tenders = 1;
}
