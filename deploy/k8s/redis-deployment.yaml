apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: docker.io/library/redis:7.4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
        args: ["--save", "", "--appendonly", "no"]
